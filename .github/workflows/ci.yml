name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, Julia ${{ matrix.julia }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, julia: 'lts', long: '1', dispatch: true }
          - { os: ubuntu-latest, julia: '1.12', long: '1', dispatch: true }
          - { os: ubuntu-latest, julia: '1', long: '', dispatch: false }
          - { os: ubuntu-24.04-arm, julia: '1', long: '', dispatch: false }
          - { os: macos-latest, julia: '1', long: '', dispatch: false }
          - { os: windows-latest, julia: '1', long: '', dispatch: false }
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}

      - uses: julia-actions/cache@v3

      - name: Run tests
        env:
          FORGEDPQ_LONG_TESTS: ${{ matrix.long }}
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Runtime-dispatch check
        if: ${{ matrix.dispatch }}
        run: julia test/timing/dispatch.jl

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - uses: julia-actions/cache@v3

      - name: Tests with coverage
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Coverage summary
        run: |
          julia -e '
            using Pkg; Pkg.activate(temp=true); Pkg.add("Coverage"; io=devnull)
            using Coverage
            c = process_folder("src"); covered, total = get_summary(c)
            pct = round(100 * covered / total, digits=1)
            open(ENV["GITHUB_STEP_SUMMARY"], "a") do io
                println(io, "### Line coverage: $pct% ($covered of $total lines in src/)")
            end
            println("Line coverage: $pct% ($covered of $total lines)")'

  interop:
    runs-on: ubuntu-latest
    env:
      OQS: ${{ github.workspace }}/../liboqs
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - uses: julia-actions/cache@v3

      - uses: actions/cache@v6
        id: oqs
        with:
          path: ${{ env.OQS }}
          key: liboqs-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build liboqs 0.16.0
        if: steps.oqs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build
          git clone -q --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs "$RUNNER_TEMP/oqs-src"
          cmake -S "$RUNNER_TEMP/oqs-src" -B "$RUNNER_TEMP/oqs-build" -GNinja -DOQS_BUILD_ONLY_LIB=ON \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DOQS_USE_OPENSSL=OFF \
            -DCMAKE_INSTALL_PREFIX="$OQS" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$RUNNER_TEMP/oqs-build"
          cmake --install "$RUNNER_TEMP/oqs-build"

      - name: Build shim
        run: >
          gcc -O2 -shared -fPIC -o test/interop/liboqs_shim.so test/interop/oqs_shim.c -I"$OQS/include"
          -Wl,--whole-archive "$OQS/lib/liboqs.a" -Wl,--no-whole-archive

      - name: liboqs interop
        run: julia --project=. test/interop/liboqs_interop.jl
